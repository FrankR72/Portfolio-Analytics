[project]
name = "carbon-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi[standard]>=0.139.2",
    "ollama>=0.6.3",
    "openai>=3.24.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.60.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
[tool.pytest.ini_options]
# Tests import app modules the same way the app does (`from models import models`,
# `from services.x import ...`), so backend/app/ is the import root.
pythonpath = ["backend/app"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
